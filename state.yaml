global_phase: BUILDER
project_context: "A web-based interactive calculator for hair extension costs at a beauty studio. Users enter hair weight (grams) and length (cm). The app calculates the required number of capsules (based on a length-to-capsule mapping) and multiplies by the price per capsule to display the total cost. The design should be elegant, clean, and suitable for a beauty salon, featuring the studio's logo."
